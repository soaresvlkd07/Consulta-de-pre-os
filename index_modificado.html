<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Consulta de Preços</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;color:#111827}
body{display:flex;justify-content:center}.app{width:min(760px,100%);min-height:100vh;background:#fff}
header{padding:22px 18px 18px;background:#111827;color:#fff;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.75}
.search{display:flex;gap:8px;margin-top:16px}.search input{min-width:0;flex:1;padding:14px 15px;border:0;border-radius:12px;font-size:16px;outline:none}
button{border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}.scan{background:#fff;color:#111827;font-size:18px;width:52px}
main{padding:16px}.hint{font-size:13px;color:#6b7280;margin:4px 2px 14px}
#results{display:grid;gap:10px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff;cursor:pointer}
.card:active{transform:scale(.995)}.name{font-weight:700;font-size:16px;line-height:1.25}.meta{font-size:12px;color:#6b7280;margin-top:6px}
.price{font-size:24px;font-weight:800;margin-top:8px}.empty{text-align:center;padding:45px 20px;color:#6b7280}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}.box{width:min(520px,100%);background:#fff;border-radius:18px;padding:16px}.box video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}.close{margin-top:10px;width:100%;height:46px;background:#e5e7eb}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}.detail.show{display:flex}.panel{width:min(760px,100%);background:#fff;border-radius:20px 20px 0 0;padding:22px;max-height:80vh;overflow:auto}.panel .big{font-size:34px;font-weight:900;margin:10px 0 18px}.panel button{height:46px;background:#111827;color:#fff;width:100%}
@media(min-width:600px){.detail{align-items:center}.panel{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Consulta de preços</h1>
  <div class="sub">Pesquise por produto, código interno ou código de barras</div>
  <div class="search">
    <input id="q" autocomplete="off" inputmode="search" placeholder="Digite o nome ou código..." autofocus>
    <button class="scan" id="scanBtn" aria-label="Escanear código">▣</button>
  </div>
</header>
<main>
  <div class="hint" id="hint">Carregando produtos...</div>
  <div id="results"></div>
</main>
</div>

<div class="modal" id="scanner">
  <div class="box">
    <video id="video" playsinline></video>
    <div class="hint" id="scanHint">Aponte a câmera para o código de barras.</div>
    <button class="close" id="closeScan">Fechar</button>
  </div>
</div>

<div class="detail" id="detail">
  <div class="panel">
    <div id="detailContent"></div>
    <button id="closeDetail">Voltar</button>
  </div>
</div>

<script>
let products=[], timer=0, stream=null, detector=null;

const q=document.getElementById('q'), results=document.getElementById('results'), hint=document.getElementById('hint');

function norm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function money(v){
  if(v===null || v===undefined || Number.isNaN(v)) return 'Preço não informado';
  return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function show(list){
  if(!list.length){results.innerHTML='<div class="empty">Nenhum produto encontrado.</div>';return;}
  const frag=document.createDocumentFragment();
  list.slice(0,80).forEach(p=>{
    const el=document.createElement('div'); el.className='card';
    el.innerHTML='<div class="name"></div><div class="meta"></div><div class="price"></div>';
    el.querySelector('.name').textContent=p.d||'Produto sem descrição';
    el.querySelector('.meta').textContent=(p.e?'EAN: '+p.e+' • ':'')+(p.c?'Código: '+p.c:'');
    el.querySelector('.price').textContent=money(p.p);
    el.onclick=()=>openDetail(p);
    frag.appendChild(el);
  });
  results.replaceChildren(frag);
  hint.textContent=list.length>80 ? 'Mostrando os 80 primeiros resultados.' : `${list.length} resultado(s).`;
}
function search(term){
  term=norm(term);
  if(!term){hint.textContent=`${products.length.toLocaleString('pt-BR')} produtos disponíveis`;results.innerHTML='<div class="empty">Digite o nome ou código do produto.</div>';return;}
  const digits=term.replace(/\D/g,'');
  const out=[];
  for(const p of products){
    const d=norm(p.d), c=norm(p.c), e=p.e||'';
    if(d.includes(term)||c.includes(term)||(digits && e.includes(digits))) out.push(p);
    if(out.length>=81) break;
  }
  show(out);
}
function openDetail(p){
  document.getElementById('detailContent').innerHTML='';
  const box=document.createElement('div');
  const name=document.createElement('h2'); name.textContent=p.d||'Produto';
  const price=document.createElement('div'); price.className='big'; price.textContent=money(p.p);
  const meta=document.createElement('div'); meta.className='meta';
  meta.textContent=[p.e&&('EAN: '+p.e),p.c&&('Código: '+p.c)].filter(Boolean).join(' • ');
  box.append(name,price,meta);document.getElementById('detailContent').appendChild(box);
  document.getElementById('detail').classList.add('show');
}
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>search(q.value),80);});
document.getElementById('closeDetail').onclick=()=>document.getElementById('detail').classList.remove('show');
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')e.currentTarget.classList.remove('show');});

async function startScanner(){
  const modal=document.getElementById('scanner');modal.classList.add('show');
  if(!('BarcodeDetector' in window)){document.getElementById('scanHint').textContent='Seu navegador não oferece leitura de código de barras pela câmera. Use a caixa de pesquisa ou um leitor USB/Bluetooth.';return;}
  try{
    detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    const video=document.getElementById('video');video.srcObject=stream;await video.play();
    scanLoop(video);
  }catch(e){document.getElementById('scanHint').textContent='Não foi possível acessar a câmera. Verifique a permissão do navegador.';}
}
async function scanLoop(video){
  if(!document.getElementById('scanner').classList.contains('show')) return;
  try{
    const codes=await detector.detect(video);
    if(codes.length){
      const value=codes[0].rawValue||'';
      stopScanner();
      q.focus();
      q.select();
      q.setRangeText(value, 0, q.value.length, 'end');
      q.select();
      search(value);
      return;
    }
  }catch(e){}
  requestAnimationFrame(()=>scanLoop(video));
}
function stopScanner(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  document.getElementById('scanner').classList.remove('show');
}
document.getElementById('scanBtn').onclick=startScanner;
document.getElementById('closeScan').onclick=stopScanner;

fetch('products.json').then(r=>r.json()).then(data=>{
  products=data.filter(p=>p.s!=='Inativo');
  hint.textContent=`${products.length.toLocaleString('pt-BR')} produtos disponíveis`;
  results.innerHTML='<div class="empty">Digite o nome ou código do produto.</div>';
}).catch(()=>{
  hint.textContent='Não foi possível carregar a base de produtos.';
  results.innerHTML='<div class="empty">Coloque este arquivo junto com products.json no mesmo local.</div>';
});
</script>
</body>
</html>
